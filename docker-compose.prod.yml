name: weeklylunch-prod

services:
  backend:
    build:
      context: ./backend
    container_name: weeklylunch-prod-backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: "file:/data/weeklylunch.db"
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - weeklylunch-prod-sqlite:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: "/api"
    container_name: weeklylunch-prod-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:80"
    restart: unless-stopped

volumes:
  weeklylunch-prod-sqlite:
    name: weeklylunch-prod-sqlite
