name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend and migrations
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: file:./ci.db
      JWT_SECRET: ci-only-secret-with-at-least-thirty-two-characters
      PORT: 3001
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      ADMIN_EMAIL: admin-ci@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run prisma:migrate
      - run: npm run build
      - run: npm audit --omit=dev

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      VITE_API_URL: /api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm audit --omit=dev

  production-config:
    name: Production configuration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Prepare non-secret validation environment
        run: cp backend/.env.production.example backend/.env
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.prod.yml build
