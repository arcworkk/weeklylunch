services:
  backend:
    build:
      context: ./backend
    container_name: weeklylunch-backend
    environment:
      DATABASE_URL: "file:/data/dev.db"
      JWT_SECRET: "${JWT_SECRET:-change-me-in-production}"
      ADMIN_EMAIL: "${ADMIN_EMAIL:-test@weeklylunch.local}"
      PORT: "3001"
      UPLOAD_DIR: "/data/uploads"
      SEED_ON_START: "${SEED_ON_START:-false}"
    expose:
      - "3001"
    volumes:
      - weeklylunch-sqlite:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: weeklylunch-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_HOST:-0.0.0.0}:${APP_PORT:-5173}:80"
    restart: unless-stopped

volumes:
  weeklylunch-sqlite:
    name: weeklylunch-sqlite
